name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          set -e
          mkdir -p app/www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png app/www/
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets@3
          npx cap init "Gyurma" com.bendivida.naplo --web-dir www
          npx cap add android
          cat > android/app/src/main/java/com/bendivida/naplo/MainActivity.java <<'EOF'
          package com.bendivida.naplo;

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.LayerDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) { w.setNavigationBarContrastEnforced(false); }
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              c.setAppearanceLightStatusBars(true);
              c.setAppearanceLightNavigationBars(true);
              View root = findViewById(android.R.id.content);
              root.setBackgroundColor(0xFFF7F5FA);
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets i = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout() | WindowInsetsCompat.Type.ime());
                v.setPadding(i.left, i.top, i.right, i.bottom);
                LayerDrawable ld = new LayerDrawable(new Drawable[] { new ColorDrawable(0xFFFFFFFF), new ColorDrawable(0xFFF7F5FA) });
                ld.setLayerInset(1, 0, 0, 0, i.bottom);
                v.setBackground(ld);
                return WindowInsetsCompat.CONSUMED;
              });
            }
          }
          EOF
          mkdir -p assets
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert ../icon-maskable-512.png -resize 1024x1024 assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#2CC6B5' --iconBackgroundColorDark '#2CC6B5'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Naplo.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Naplo.apk --title "Napló (Android)" --notes "Android app. Download Naplo.apk and install it on the phone."
