<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gyurma</title>
<meta name="theme-color" content="#F7F5FA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gyurma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{background:#F7F5FA;-webkit-text-size-adjust:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}

/* Layout: egy keskeny telefonoszlop, fix alsó menüsor; világos, lekerekített felületek, edzésnaponként saját szín */
:root{--bg:#F7F5FA;--ink:#25222D;--mute:#6E6A78;--line:#E6E2EC;--card:#FFFFFF;--track:#ECE8F1;--faint:#B0ACBA;--danger:#B42349;--ok:#3A610A;--ok-tint:#E7F5CF;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #25222D;outline-offset:2px}
#app{max-width:430px;margin:0 auto;padding-top:24px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));min-width:0}
h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h1.long{font-size:25px}
h2{margin:0;font-size:18px;font-weight:800}
.eyebrow{font-size:13px;font-weight:600;color:var(--mute)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.hdr>div:first-child{min-width:0}
.btns{display:flex;gap:8px;flex:none}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ib.bare{border:0;background:transparent;border-radius:14px}
.ib.danger{color:var(--danger)}
.ib.ok{background:var(--ink);color:#fff;border-color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.seg{margin:18px 4px 0;padding:4px;background:var(--track);border-radius:16px;display:flex;gap:4px}
.seg button{flex:1;height:40px;border:0;border-radius:12px;background:transparent;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px rgba(37,34,45,.14);font-weight:700;color:var(--ink)}
.linkbtn{display:block;margin:12px auto 0;border:0;background:transparent;font-size:13px;font-weight:700;color:#0A6F65;min-height:44px;padding:0 12px}

.wk{margin-top:18px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;font-weight:700;color:var(--mute)}
.grid{margin-top:8px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{height:54px;border-radius:14px;border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:600;color:var(--ink);padding:0}
.cell.out{background:transparent;color:#A5A1AF;font-weight:500}
.cell.has{background:var(--tint);color:var(--deep);font-weight:700}
.cell .ltr{font-size:11px;font-weight:800;line-height:1}
.cell.today{border:2px solid var(--ink);font-weight:800}
.cell.today:not(.has){background:#fff;color:var(--ink)}
.legend{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--deep);font-size:12px;font-weight:700}
.chip i{width:8px;height:8px;border-radius:4px;background:var(--solid)}
.card{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 2px 10px rgba(37,34,45,.06)}
.todaycard{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.todaycard .sm{font-size:12px;font-weight:600;color:var(--mute)}
.todaycard .big{margin-top:2px;font-size:15px;font-weight:700}

.btn{height:52px;border:0;border-radius:16px;font-weight:700;font-size:15px;padding:0 18px}
.btn.pri{background:var(--ink);color:#fff}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:#fff;border:1px solid #F0C2CF;color:var(--danger)}
.btn.small{height:44px;font-size:14px;padding:0 14px;border-radius:14px}
.btn.wide{width:100%}

.rows{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.wrow{display:flex;align-items:center;gap:12px}
.wdate{width:44px;text-align:center;flex:none}
.wdate .d{font-size:12px;font-weight:700;color:var(--mute)}
.wdate .n{font-size:20px;font-weight:800;line-height:1.2}
.wdate .n.now{width:36px;height:36px;margin:0 auto;border-radius:18px;background:var(--ink);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.wcard{flex:1;min-width:0;min-height:64px;border:0;border-radius:20px;background:var(--tint);padding:0 16px 0 14px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--deep)}
.dot{width:38px;height:38px;border-radius:19px;background:var(--solid);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--on,var(--ink));flex:none}
.wcard .t{flex:1;min-width:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard.empty{background:transparent;border:1.5px dashed #D3CEDC;color:var(--mute);padding-left:18px}
.wcard.empty .t{font-size:15px;font-weight:600}
.wcard.empty.today{background:#fff;border:2px solid var(--ink);color:var(--ink)}
.wcard.empty.today .t{font-weight:700}

.savechip{flex:none;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--ok-tint);font-size:12px;font-weight:700;color:var(--ok)}
.savechip.busy,.savechip.local{background:var(--track);color:var(--mute)}
.savechip.err{background:#FDE3EA;color:var(--danger)}
.dsel{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.dsel button{min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:15px;font-weight:600;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsel button[aria-pressed=true]{border:2px solid var(--solid);background:var(--tint);color:var(--deep);font-weight:800}
.empty-note{margin-top:20px;padding:22px 18px;border:1.5px dashed #D3CEDC;border-radius:22px;text-align:center;color:var(--mute);font-weight:600;line-height:1.5}
.stack{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ex{background:#fff;border-radius:22px;padding:14px 14px 14px 16px;box-shadow:0 2px 10px rgba(37,34,45,.06)}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap}
.ex-top .nm{font-size:17px;font-weight:800;min-width:0}
.hint{padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--deep);font-size:12px;font-weight:700}
.hint.none{background:var(--track);color:var(--mute)}
.fields{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
.fields label{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.fields input{margin-top:4px;width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--bg);text-align:center;font-size:18px;font-weight:800;color:var(--ink);min-width:0}
.fields input.w{background:#fff;border:1px dashed #CFCAD8}
.fields input.w.filled{border:2px solid var(--solid)}
input::placeholder,textarea::placeholder{color:#8F8B9A;opacity:1;font-weight:600}
.note label{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.note textarea{margin-top:4px;width:100%;border:0;resize:none;padding:0;background:transparent;font-size:16px;font-weight:500;color:var(--ink);outline:none;min-height:48px}
.note:focus-within{outline:3px solid var(--ink);outline-offset:2px}

.plan{width:100%;border:0;border-radius:24px;background:var(--tint);padding:16px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--deep)}
.plan .dot{width:54px;height:54px;border-radius:27px;font-size:24px}
.plan .tx{flex:1;min-width:0}
.plan .a{display:block;font-size:18px;font-weight:800}
.plan .b{display:block;margin-top:3px;font-size:13px;font-weight:600}
.plan .c{display:block;margin-top:2px;font-size:13px;font-weight:500;color:var(--ink);opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dashed{width:100%;min-height:64px;border:2px dashed #CFCAD8;border-radius:24px;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink)}
.banner{margin-top:16px;padding:14px 16px;border-radius:18px;background:#FFF3CF;color:#6B4A00;font-size:13px;font-weight:600;line-height:1.5;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.banner button{flex:none;min-height:44px;border:0;background:transparent;font-size:13px;font-weight:800;color:#6B4A00;padding:0 4px}
.sect{margin:22px 4px 10px;display:flex;align-items:baseline;justify-content:space-between}
.data p{margin:6px 0 0;font-size:13px;font-weight:500;color:var(--mute);line-height:1.5}
.data .row{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

.field{background:#fff;border-radius:22px;padding:14px 16px 16px;box-shadow:0 2px 10px rgba(37,34,45,.06)}
.field label,.field .lb{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.field input[type=text]{margin-top:6px;width:100%;height:48px;border:2px solid var(--solid);border-radius:14px;background:#fff;padding:0 14px;font-size:17px;font-weight:700}
.sw{margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:22px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);background:var(--solid);padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:none}
.sw button{color:var(--on,var(--ink))}
.sw .swc{background:conic-gradient(#FF5C5C,#FFC857,#98D04A,#2CC6B5,#5B8CFF,#B9A4FF,#FF7EB0,#FF5C5C)}
.sw .swc.on{background:var(--solid)}
.sw .swc .plus{width:22px;height:22px;border-radius:11px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.sheet.cp h2{margin-bottom:12px}
.cp-prev{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--tint)}
.sv{position:relative;margin-top:14px;height:190px;border-radius:18px;touch-action:none;cursor:crosshair;background-image:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,rgba(255,255,255,0))}
.svthumb{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:13px;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(37,34,45,.5),0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.hue{position:relative;margin-top:16px;height:20px;border-radius:10px;touch-action:none;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.huethumb{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:14px;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(37,34,45,.5),0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.hexrow{margin-top:16px;display:flex;align-items:center;gap:12px}
.hexrow label{font-size:12px;font-weight:700;color:var(--mute);width:32px}
.hexrow input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:17px;font-weight:700;letter-spacing:.04em;background:var(--bg)}
#exlist{display:flex;flex-direction:column;gap:8px}
.exrow{min-height:60px;background:#fff;border-radius:18px;padding:0 6px 0 4px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 10px rgba(37,34,45,.06);touch-action:pan-y}
.exrow .nm{flex:1;min-width:0;font-size:16px;font-weight:700;overflow-wrap:anywhere;padding:8px 0}
.exrow.dragging{box-shadow:0 8px 24px rgba(37,34,45,.2);position:relative;z-index:2}
.exrow.editing{padding:8px 6px 8px 12px}
.exrow input{flex:1;min-width:0;height:44px;border:2px solid var(--ink);border-radius:12px;padding:0 12px;font-size:16px;font-weight:700;background:#fff}
.handle{width:36px;height:48px;border:0;background:transparent;touch-action:none;cursor:grab;color:var(--faint);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.exrow.confirm{padding:8px 8px 8px 16px;gap:8px;flex-wrap:wrap}
.footbtns{margin-top:24px;display:flex;gap:10px}
.footbtns .pri{flex:1}

.pickbtn{margin-top:14px;width:100%;min-height:60px;border:1px solid var(--line);border-radius:20px;background:#fff;padding:8px 16px 8px 14px;display:flex;align-items:center;gap:12px;text-align:left;font-size:17px;font-weight:800;box-shadow:0 2px 10px rgba(37,34,45,.06)}
.pickbtn .pd{width:12px;height:12px;border-radius:6px;background:var(--solid);flex:none}
.pickbtn .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.pickbtn small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.sheet.pick{display:flex;flex-direction:column;max-height:78vh;padding:12px 16px 16px}
.sheet.pick h2{padding:0 4px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.pl{margin-top:10px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.pg{margin:10px 0 2px 4px}
.pg:first-child{margin-top:0}
.po{min-height:52px;border:0;border-radius:16px;background:var(--bg);padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-size:16px;font-weight:700;color:var(--ink)}
.po.on{background:var(--tint);color:var(--deep);font-weight:800}
.hero{margin-top:10px;background:var(--tint);border-radius:24px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--deep)}
.hero .l{font-size:13px;font-weight:700}
.hero .v{margin-top:2px;font-size:36px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.hero .v.sm{font-size:26px}
.hero .s{margin-top:2px;font-size:13px;font-weight:600}
.delta{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:999px;background:#fff;font-size:15px;font-weight:800;color:var(--ok)}
.delta.flat{color:var(--mute)}
.delta.down{color:#A81D5A}
.hero .r{flex:none;text-align:center}
.hero .r small{display:block;margin-top:4px;font-size:11px;font-weight:600}
.chartcard{margin-top:10px;padding:14px 14px 10px}
.chartcard .tt{padding:0 4px;font-size:15px;font-weight:800}
.chartcard svg{display:block;margin-top:6px;width:100%;height:auto}
.chartcard .none{padding:18px 4px 10px;font-size:14px;font-weight:500;color:var(--mute);line-height:1.5}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{min-height:48px;border:0;background:#fff;border-radius:16px;padding:0 16px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.hrow .dt{width:78px;flex:none;font-size:14px;font-weight:700}
.hrow .chip{padding:3px 9px;font-weight:800;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .rp{flex:1;text-align:right;font-size:14px;font-weight:600;color:var(--mute)}
.hrow .wt{min-width:62px;text-align:right;font-size:15px;font-weight:800}

.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--track);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20}
.navin{max-width:430px;margin:0 auto;display:flex;justify-content:space-around}
.nb{width:104px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;font-size:12px;font-weight:600;color:var(--mute)}
.nb .pill{width:58px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nb.on{color:var(--ink);font-weight:800}
.nb.on .pill{background:#D4F5F0;color:#0A6F65}

.overlay{position:fixed;inset:0;background:rgba(37,34,45,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:50}
.sheet{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:430px}
.sheet p{margin:8px 0 0;font-size:14px;font-weight:500;color:var(--mute);line-height:1.5}
.sheet textarea{margin-top:12px;width:100%;height:160px;border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:none;background:var(--bg)}
.sheet .row{margin-top:16px;display:flex;gap:8px}
.sheet .row .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
</style>

</head>

<div id="app" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toastbox" role="status"></div>

<script>
(function () {
  'use strict';

  /* ---------- konstansok ---------- */
  var MON = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
  var MONS = ['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
  var WDS = ['H','K','Sze','Cs','P','Szo','V'];
  var WDL = ['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
  var PAL = {
    teal:  { solid:'#2CC6B5', tint:'#D4F5F0', deep:'#0A6F65', label:'Türkiz' },
    green: { solid:'#98D04A', tint:'#E7F5CF', deep:'#3A610A', label:'Almazöld' },
    pink:  { solid:'#FF7EB0', tint:'#FFE0EC', deep:'#A81D5A', label:'Rózsaszín' },
    lav:   { solid:'#B9A4FF', tint:'#ECE5FF', deep:'#5B3FC4', label:'Levendula' },
    peach: { solid:'#FFB27A', tint:'#FFE8D6', deep:'#9A4A0C', label:'Barack' }
  };
  var PAL_KEYS = Object.keys(PAL);
  var GREY = { solid:'#B0ACBA', tint:'#ECE8F1', deep:'#5B5766' };

  /* egyéni szín: a kiválasztott színből képezzük a jelölő, háttér és szöveg árnyalatot */
  function isHex(s) { return typeof s === 'string' && /^#[0-9a-fA-F]{6}$/.test(s); }
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbHex(r, g, b) { return '#' + [r, g, b].map(function (x) { x = Math.max(0, Math.min(255, Math.round(x))); return (x < 16 ? '0' : '') + x.toString(16); }).join(''); }
  function lum(r, g, b) { var f = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); }
  function contrast(a, b) { var la = lum(a[0], a[1], a[2]), lb = lum(b[0], b[1], b[2]); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }

  function niceTicks(min, max) {
    var range = (max - min) || Math.max(Math.abs(max) * 0.2, 1);
    var raw = range / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var steps = [1, 2, 2.5, 5, 10], step = mag * 10;
    for (var i = 0; i < steps.length; i++) { if (steps[i] * mag >= raw) { step = steps[i] * mag; break; } }
    var tmin = Math.floor(min / step) * step, tmax = Math.ceil(max / step) * step;
    if (tmax === tmin) tmax += step;
    var t = [];
    for (var v = tmin; v <= tmax + step / 1000; v += step) t.push(Math.round(v * 1000) / 1000);
    return t;
  }
  function chartSVG(pts, name) {
    var W = 326, L = 44, R = 316, T = 16, B = 120;
    var ws = pts.map(function (p) { return p.w; });
    var ticks = niceTicks(Math.min.apply(null, ws), Math.max.apply(null, ws));
    var tmin = ticks[0], tmax = ticks[ticks.length - 1];
    var t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    function X(t) { return L + (t - t0) / (t1 - t0) * (R - L); }
    function Y(w) { return B - (w - tmin) / (tmax - tmin) * (B - T); }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.w).toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    var s = '<svg viewBox="0 0 ' + W + ' 150" role="img" aria-label="Vonaldiagram: ' + esc(name) + ' súlya ' + fmtNum(pts[0].w) + ' kg-ról ' + fmtNum(last.w) + ' kg-ra változott">';
    ticks.forEach(function (v) {
      s += '<line x1="34" y1="' + Y(v).toFixed(1) + '" x2="322" y2="' + Y(v).toFixed(1) + '" stroke="#ECE8F1" stroke-width="1"/><text x="26" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" font-weight="600" fill="#6E6A78">' + fmtNum(v) + '</text>';
    });
    s += '<path d="' + line + ' L' + X(last.t).toFixed(1) + ' ' + B + ' L' + L + ' ' + B + ' Z" fill="#2CC6B5" fill-opacity="0.16"/>';
    s += '<path d="' + line + '" fill="none" stroke="#1FB5A4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
    if (pts.length <= 24) pts.slice(0, -1).forEach(function (p) { s += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.w).toFixed(1) + '" r="4.5" fill="#FFFFFF" stroke="#1FB5A4" stroke-width="2.5"/>'; });
    s += '<circle cx="' + X(last.t).toFixed(1) + '" cy="' + Y(last.w).toFixed(1) + '" r="7" fill="#25222D" stroke="#FFFFFF" stroke-width="3"/>';
    s += '<text x="' + L + '" y="142" font-size="11" font-weight="600" fill="#6E6A78">' + esc(shortDate(pts[0].date)) + '</text><text x="322" y="142" text-anchor="end" font-size="11" font-weight="600" fill="#6E6A78">' + esc(shortDate(last.date)) + '</text></svg>';
    return s;
  }

  function nextDay() {
    var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', nm = null;
    for (var i = 0; i < letters.length; i++) {
      var cand = letters[i] + ' nap';
      if (!S.days.some(function (d) { return d.name === cand; })) { nm = cand; break; }
    }
    var used = S.days.map(function (d) { return d.color; });
    var col = PAL_KEYS.filter(function (k) { return used.indexOf(k) < 0; })[0] || PAL_KEYS[S.days.length % PAL_KEYS.length];
    return { id: uid(), name: nm || (S.days.length + 1) + '. nap', color: col, ex: [] };
  }

  function saveFile(name, text) {
    var cap = window.Capacitor, P = cap && cap.Plugins;
    if (cap && cap.isNativePlatform && cap.isNativePlatform() && P && P.Filesystem && P.Share) {
      return P.Filesystem.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' })
        .then(function (w) { return P.Share.share({ title: name, url: w.uri, dialogTitle: 'Exportálás' }); })
        .then(function () { return true; }, function (e) { return (e && /cancel/i.test(String(e.message || e))) ? 'cancel' : false; });
    }
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    function viaShare() {
      var file = null;
      try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
      if (!file || !navigator.canShare || !navigator.canShare({ files: [file] })) return Promise.resolve(false);
      return navigator.share({ files: [file] }).then(function () { return true; }, function (e) { return (e && e.name === 'AbortError') ? 'cancel' : false; });
    }
    function viaLink() {
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        return Promise.resolve(true);
      } catch (e) { return Promise.resolve(false); }
    }
    if (isIOS) return viaShare().then(function (r) { return r === false ? viaLink() : r; });
    return viaLink();
  }

  function exportData() {
    var payload = JSON.stringify({ app: 'edzesnaplo', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2);
    saveFile('edzesnaplo-' + ymd(new Date()) + '.json', payload).then(function (r) {
      if (r === 'cancel') return;
      if (r) { S.lastExport = new Date().toISOString(); persist(); toast('Az exportálás kész'); render(true); }
      else { UI.modal = { type: 'copy', text: payload }; render(true); }
    });
  }

  /* ---------- események ---------- */
  var app = document.getElementById('app');

  app.addEventListener('click', function (ev) {
    if (ev.target.classList && ev.target.classList.contains('overlay') && UI.modal && UI.modal.type !== 'color') { UI.modal = null; render(true); return; }
    var t = ev.target.closest('[data-a]');
    if (!t) return;
    var a = t.dataset.a, id = t.dataset.id;
    switch (a) {
      case 'color-custom': {
        var dc = editDay(); if (!dc) break;
        var base = isHex(dc.color) ? dc.color : (PAL[dc.color] || PAL.teal).solid, hv = rgbHsv.apply(null, hexRgb(base));
        UI.modal = { type: 'color', h: hv.h, s: hv.s, v: hv.v, drag: null, pid: null };
        render(true); break;
      }
      case 'cp-ok': {
        var dd = editDay();
        if (dd && UI.modal && UI.modal.type === 'color') { dd.color = rgbHex.apply(null, hsvRgb(UI.modal.h, UI.modal.s, UI.modal.v)); persist(); }
        UI.modal = null; render(true); break;
      }
      case 'ex-pick-open': UI.modal = { type: 'pick' }; render(true); break;
      case 'ex-pick': UI.statEx = id; UI.allHist = false; UI.modal = null; render(true); break;
      case 'tab': go(t.dataset.tab); break;
      case 'cal-mode':
        if (UI.calMode !== t.dataset.mode) {
          UI.calMode = t.dataset.mode;
          var n = new Date();
          if (UI.calMode === 'week') UI.cur = (n.getFullYear() === UI.cur.getFullYear() && n.getMonth() === UI.cur.getMonth()) ? n : new Date(UI.cur.getFullYear(), UI.cur.getMonth(), 1);
          render(true);
        }
        break;
      case 'cal-prev': case 'cal-next': {
        var s = a === 'cal-next' ? 1 : -1;
        UI.cur = UI.calMode === 'month' ? new Date(UI.cur.getFullYear(), UI.cur.getMonth() + s, 1) : addDays(UI.cur, 7 * s);
        render(true); break;
      }
      case 'cal-today': UI.cur = new Date(); render(true); break;
      case 'open-day': resetEdit(); UI.date = t.dataset.date; UI.screen = 'day'; render(); break;
      case 'back-cal': go('cal'); break;
      case 'back-plans': go('plans'); break;
      case 'pick-day':
        var lg = S.logs[UI.date];
        if (!lg) S.logs[UI.date] = { dayId: id, note: '', entries: {} }; else lg.dayId = id;
        UI.delLog = false; persist(); render(true); break;
      case 'log-del': UI.delLog = true; render(true); break;
      case 'log-del-no': UI.delLog = false; render(true); break;
      case 'log-del-yes': delete S.logs[UI.date]; persist(); UI.delLog = false; go('cal'); break;
      case 'plan-open': resetEdit(); UI.editId = id; UI.screen = 'edit'; render(); break;
      case 'plan-new': var nd = nextDay(); S.days.push(nd); persist(); resetEdit(); UI.editId = nd.id; UI.screen = 'edit'; UI.focusSel = '#dayName'; render(); break;
      case 'examples-dismiss': S.examples = false; persist(); render(true); break;
      case 'set-color': var d1 = editDay(); if (d1) { d1.color = t.dataset.color; persist(); render(true); } break;
      case 'ex-edit': UI.editingEx = id; UI.delEx = null; UI.adding = false; UI.focusSel = '#renEx'; render(true); break;
      case 'ex-ren-ok': doRename(); break;
      case 'ex-cancel': UI.editingEx = null; UI.delEx = null; UI.adding = false; render(true); break;
      case 'ex-del': UI.delEx = id; UI.editingEx = null; UI.adding = false; render(true); break;
      case 'ex-del-yes': var d2 = editDay(); if (d2) { d2.ex = d2.ex.filter(function (x) { return x.id !== UI.delEx; }); persist(); } UI.delEx = null; render(true); break;
      case 'ex-add-open': UI.adding = true; UI.editingEx = null; UI.delEx = null; UI.focusSel = '#newEx'; render(true); break;
      case 'ex-add-ok': doAdd(); break;
      case 'day-del': UI.delDay = true; render(true); break;
      case 'day-del-no': UI.delDay = false; render(true); break;
      case 'day-del-yes': S.days = S.days.filter(function (d) { return d.id !== UI.editId; }); persist(); go('plans'); break;
      case 'hist-toggle': UI.allHist = !UI.allHist; render(true); break;
      case 'export': exportData(); break;
      case 'copy-open': UI.modal = { type: 'copy', text: JSON.stringify({ app: 'edzesnaplo', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2) }; render(true); break;
      case 'import-open': document.getElementById('importFile').click(); break;
      case 'modal-close': UI.modal = null; render(true); break;
      case 'copy-do': {
        var box = document.getElementById('jsonBox');
        var done = function () { toast('Kimásolva'); };
        var fallback = function () { box.focus(); box.select(); toast('Jelöld ki és másold ki a szöveget'); };
        try { navigator.clipboard.writeText(UI.modal.text).then(done, fallback); } catch (e) { fallback(); }
        break;
      }
      case 'import-yes':
        S = UI.modal.state; UI.modal = null; UI.statEx = null; persist(); flush(); toast('Az importálás kész'); go('plans'); break;
    }
  });

  app.addEventListener('input', function (ev) {
    var el = ev.target, f = el.dataset && el.dataset.f;
    if (!f) return;
    if (f === 'cphex') {
      var hxv = el.value.trim(); if (hxv.charAt(0) !== '#') hxv = '#' + hxv;
      if (isHex(hxv) && UI.modal && UI.modal.type === 'color') { var hh = rgbHsv.apply(null, hexRgb(hxv)); UI.modal.h = hh.h; UI.modal.s = hh.s; UI.modal.v = hh.v; cpUpdate(true); }
      return;
    }
    if (f === 'dayname') { var d = editDay(); if (d) { d.name = el.value; persist(); } return; }
    var log = S.logs[UI.date];
    if (!log) return;
    if (f === 'note') { log.note = el.value; persist(); return; }
    var exId = el.dataset.ex, day = dayOf(log.dayId), nm = '';
    if (day) day.ex.forEach(function (x) { if (x.id === exId) nm = x.name; });
    var e = log.entries[exId] || { s: null, r: null, w: null, n: nm };
    var raw = el.value.trim().replace(',', '.'), v = raw === '' ? null : parseFloat(raw);
    if (v != null && !isFinite(v)) v = null;
    if (f !== 'w' && v != null) v = Math.round(v);
    e[f] = v; e.n = nm || e.n;
    if (hasData(e)) log.entries[exId] = e; else delete log.entries[exId];
    if (f === 'w') el.classList.toggle('filled', e.w != null);
    persist();
  });

  app.addEventListener('change', function (ev) {
    if (ev.target.id === 'statSel') { UI.statEx = ev.target.value; UI.allHist = false; render(true); }
  });

  app.addEventListener('keydown', function (ev) {
    var el = ev.target;
    if ((el.id === 'cpSV' || el.id === 'cpHue') && UI.modal && UI.modal.type === 'color') {
      var m = UI.modal, st = ev.shiftKey ? 0.1 : 0.03, ch = false;
      if (el.id === 'cpSV') {
        if (ev.key === 'ArrowLeft') { m.s = Math.max(0, m.s - st); ch = true; }
        else if (ev.key === 'ArrowRight') { m.s = Math.min(1, m.s + st); ch = true; }
        else if (ev.key === 'ArrowUp') { m.v = Math.min(1, m.v + st); ch = true; }
        else if (ev.key === 'ArrowDown') { m.v = Math.max(0, m.v - st); ch = true; }
      } else {
        if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { m.h = Math.max(0, m.h - 4); ch = true; }
        else if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { m.h = Math.min(359.99, m.h + 4); ch = true; }
      }
      if (ch) { ev.preventDefault(); cpUpdate(); }
      return;
    }
    if (el.id === 'newEx') { if (ev.key === 'Enter') { ev.preventDefault(); doAdd(); } else if (ev.key === 'Escape') { UI.adding = false; render(true); } }
    else if (el.id === 'renEx') { if (ev.key === 'Enter') { ev.preventDefault(); doRename(); } else if (ev.key === 'Escape') { UI.editingEx = null; render(true); } }
    else if (el.classList && el.classList.contains('handle')) {
      if (ev.key === 'ArrowUp') { ev.preventDefault(); moveEx(el.dataset.id, -1); }
      else if (ev.key === 'ArrowDown') { ev.preventDefault(); moveEx(el.dataset.id, 1); }
    }
  });

  /* húzással átrendezés */
  function cpUpdate(skipHex) {
    var m = UI.modal;
    if (!m || m.type !== 'color') return;
    var sv = document.getElementById('cpSV');
    if (!sv) return;
    var hex = rgbHex.apply(null, hsvRgb(m.h, m.s, m.v));
    sv.style.backgroundColor = 'hsl(' + m.h + ',100%,50%)';
    var th = document.getElementById('cpThumb');
    th.style.left = (m.s * 100) + '%'; th.style.top = ((1 - m.v) * 100) + '%'; th.style.background = hex;
    document.getElementById('cpHue').setAttribute('aria-valuenow', Math.round(m.h));
    var ht = document.getElementById('cpHT');
    ht.style.left = (m.h / 360 * 100) + '%'; ht.style.background = 'hsl(' + m.h + ',100%,50%)';
    document.getElementById('cpPrev').setAttribute('style', vars(derive(hex)));
    if (!skipHex) document.getElementById('cpHex').value = hex.toUpperCase();
  }
  function cpPoint(ev) {
    var m = UI.modal;
    if (!m || !m.drag) return;
    var el = document.getElementById(m.drag === 'sv' ? 'cpSV' : 'cpHue'), r = el.getBoundingClientRect();
    var x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    if (m.drag === 'sv') { m.s = x; m.v = 1 - Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height)); }
    else m.h = Math.min(359.99, x * 360);
    cpUpdate();
  }
  var drag = null;
  app.addEventListener('pointerdown', function (ev) {
    var svEl = ev.target.closest('#cpSV'), huEl = ev.target.closest('#cpHue');
    if ((svEl || huEl) && UI.modal && UI.modal.type === 'color') {
      UI.modal.drag = svEl ? 'sv' : 'hue'; UI.modal.pid = ev.pointerId;
      try { (svEl || huEl).setPointerCapture(ev.pointerId); } catch (e) {}
      cpPoint(ev); ev.preventDefault();
      return;
    }
    var h = ev.target.closest('.handle');
    if (!h) return;
    var row = h.closest('.exrow'), list = row.parentElement;
    drag = { row: row, list: list, pid: ev.pointerId };
    try { list.setPointerCapture(ev.pointerId); } catch (e) {}
    row.classList.add('dragging');
    ev.preventDefault();
  });
  app.addEventListener('pointermove', function (ev) {
    if (UI.modal && UI.modal.type === 'color' && UI.modal.drag && ev.pointerId === UI.modal.pid) { cpPoint(ev); return; }
    if (!drag || ev.pointerId !== drag.pid) return;
    var rows = Array.prototype.filter.call(drag.list.querySelectorAll('.exrow'), function (r) { return r !== drag.row; });
    var before = null;
    for (var i = 0; i < rows.length; i++) {
      var b = rows[i].getBoundingClientRect();
      if (ev.clientY < b.top + b.height / 2) { before = rows[i]; break; }
    }
    if (before) { if (drag.row.nextSibling !== before) drag.list.insertBefore(drag.row, before); }
    else if (rows.length && drag.list.lastElementChild !== drag.row) drag.list.appendChild(drag.row);
  });
  function endDrag(ev) {
    if (UI.modal && UI.modal.type === 'color' && UI.modal.drag) { UI.modal.drag = null; return; }
    if (!drag || ev.pointerId !== drag.pid) return;
    var d = editDay(), ids = Array.prototype.map.call(drag.list.querySelectorAll('.exrow'), function (r) { return r.dataset.id; });
    drag.row.classList.remove('dragging');
    drag = null;
    if (d) {
      var map = {};
      d.ex.forEach(function (x) { map[x.id] = x; });
      var re = ids.map(function (i) { return map[i]; }).filter(Boolean);
      if (re.length === d.ex.length) { d.ex = re; persist(); }
    }
    render(true);
  }
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);

  /* importálás fájlból */
  document.getElementById('importFile').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var st = null;
      try { st = normalize(JSON.parse(String(r.result))); } catch (e) {}
      if (!st) { toast('Ez a fájl nem edzésnapló-mentés'); return; }
      UI.modal = { type: 'import', state: st, days: st.days.length, logs: Object.keys(st.logs).length };
      render(true);
    };
    r.onerror = function () { toast('A fájl nem olvasható'); };
    r.readAsText(f);
  });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
  init();
})();
</script>
</body>
</html>
